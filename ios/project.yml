# BrewPilot Xcode project definition. Regenerate with: xcodegen generate (from ios/)
name: BrewPilot
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.brewpilot
targets:
  BrewPilot:
    type: application
    platform: iOS
    sources:
      - path: BrewPilot
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felipemunoz.brewpilot
        DEVELOPMENT_TEAM: N22GVUM546
        INFOPLIST_FILE: BrewPilot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
